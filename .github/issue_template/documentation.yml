name: Documentation
description: Report a documentation issue or propose an improvement to existing documentation.
title: "[Docs]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        ## Before You Submit

        Documentation is an essential part of the project.\
        Thank you for helping us keep the documentation accurate, clear, and
        useful for users and contributors.\
        Before submitting this report, please:

        - Search existing Issues and Discussions to avoid duplicate reports.
        - Verify that the documentation issue still exists in the latest version.
        - Provide the exact location whenever possible.

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: |
        Provide the path, URL, section, or other location of the documentation
        that needs attention.
      placeholder: "Example: README.md, docs/getting-started.md, API reference, https://..."
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Documentation Issue Type
      description: Select the type of documentation issue or improvement.
      options:
        - Incorrect Information
        - Missing Information
        - Unclear or Ambiguous
        - Typo or Grammar
        - Outdated Information
        - Broken Link or Reference
        - Improvement or Restructuring
        - Other
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: Current Documentation
      description: |
        Describe the current content, behavior, or information that needs attention.
      placeholder: |
        Quote or summarize the relevant documentation.
        If information is missing, describe what is currently absent.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed Change
      description: Describe what should be corrected, added, removed, or improved.
      placeholder: |
        Describe the proposed documentation change.
        Include suggested wording or structure when helpful.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Provide any additional information that may help us evaluate or implement
        the documentation change.
      placeholder: |
        Examples, screenshots, references, related Issues or Discussions,
        external documentation, or other relevant information.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      description: Please confirm the following before submitting your report.
      options:
        - label: |
            I have searched existing Issues and Discussions and did not find
            a similar request.
          required: true
        - label: I have provided the relevant documentation location or context.
          required: true
        - label: I have clearly described the documentation issue or proposed improvement.
          required: true
