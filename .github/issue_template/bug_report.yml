name: Bug Report
description: Report a reproducible problem or unexpected behavior.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Before You Submit

        Thank you for taking the time to report a problem.\
        Before submitting this report, please:

        - Search existing Issues to avoid duplicate reports.
        - Make sure the issue is reproducible with the latest supported version, when possible.
        - Remove credentials, tokens, personal data, and other sensitive information from logs and examples.

        > **Security vulnerabilities must not be reported through GitHub Issues.**
        >
        > If you believe you have discovered a security vulnerability,
        > please review [SECURITY.md](../../SECURITY.md) and report it privately
        > using the designated security contact.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Provide a clear and concise description of the problem.
      placeholder: |
        Describe what happened and under what circumstances.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest set of steps required to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: |
        Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what happened instead, including any unexpected output or side effects.
      placeholder: |
        Describe the actual result.
    validations:
      required: true

  - type: textarea
    id: minimal-reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        Provide a minimal example, repository, code sample, or other resource that
        reproduces the issue, if available.
      placeholder: |
        Repository, code sample, or other reproduction:
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Project Version
      description: Specify the version, release, or commit where the issue occurred.
      placeholder: "Example: v1.2.0 or abc1234"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating System
      description: Specify the operating system and version.
      placeholder: "Example: Ubuntu 24.04 LTS, Windows 11, macOS 15"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant runtime, language, package manager, browser, or tooling versions.
      placeholder: |
        Runtime:
        Language:
        Package Manager:
        Browser:
        Other:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: |
        Include relevant logs, stack traces, or error messages. Remove credentials,
        tokens, personal data, and other sensitive information before submitting.
      render: text
      placeholder: |
        Paste relevant logs or error messages here.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Provide any additional information that may help us understand,
        diagnose, or reproduce the issue.
      placeholder: |
        Screenshots, related Issues, configuration details, workarounds, or other
        relevant information.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      description: Please confirm the following before submitting your report.
      options:
        - label: I have searched existing Issues and did not find an existing report for this problem.
          required: true
        - label: I have provided clear and reproducible steps to reproduce the issue.
          required: true
        - label: I have included the relevant project and environment versions.
          required: true
        - label: I have removed credentials, secrets, tokens, and private information from this report.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
